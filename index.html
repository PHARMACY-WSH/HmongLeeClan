<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนผังลำดับเครือญาติแห่งตระกูล (Family Echo Style)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Prompt & Charm (Vintage Thai) -->
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Prompt', sans-serif;
        }
        
        .font-vintage {
            font-family: 'Charm', cursive, 'Prompt', serif;
        }

        /* Classic Warm Grid background pattern */
        .bg-grid-pattern {
            background-color: #fcf9f2;
            background-image: radial-gradient(#d7c4b7 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Family Echo Styled Connection Lines */
        .tree-line {
            stroke: #8c6d58;
            stroke-width: 2.5;
            fill: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tree-line:hover {
            stroke: #b45309;
            stroke-width: 4;
        }
        
        .spouse-line {
            stroke: #b91c1c;
            stroke-width: 2.5;
            stroke-dasharray: 4 4;
            fill: none;
            cursor: pointer;
        }
        .spouse-line:hover {
            stroke: #991b1b;
            stroke-width: 4;
        }

        /* Custom Parchment Scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #f5efe6;
        }
        ::-webkit-scrollbar-thumb {
            background: #d7c2b0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a88b77;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Node Cards Vintage Hover Effect */
        .member-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.2s ease;
        }
        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 22px -4px rgba(120, 53, 15, 0.18);
        }

        input[type="file"]::file-selector-button {
            margin-right: 0.8rem;
            padding: 0.4rem 1rem;
            border-radius: 0.5rem;
            background-color: #fef3c7;
            color: #78350f;
            border: 1px solid #fde68a;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #fde68a;
        }
    </style>
</head>
<body class="bg-amber-900/10 text-amber-950 h-screen overflow-hidden flex flex-col">

    <!-- Top Vintage Navigation Bar -->
    <header class="bg-[#f5efe6] border-b border-amber-900/20 px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-20 shadow-sm">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-800 text-amber-50 flex items-center justify-center text-xl font-bold shadow-md shadow-amber-900/20">
                <i class="fa-solid fa-tree"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl leading-tight text-amber-950 font-vintage tracking-wide">แผนผังลำดับเครือญาติแห่งตระกูล</h1>
                <p class="text-xs text-amber-800/80">บันทึกสายเลือด สืบสานประวัติศาสตร์และตระกูล (Family Echo Style)</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative flex-1 max-w-md mx-2">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-amber-700/60"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อ, นามสกุลเดิม, ชื่อเล่น..." 
                    class="w-full pl-9 pr-8 py-1.5 text-sm bg-stone-50/80 border border-amber-900/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700 focus:bg-white transition-all text-amber-950">
            </div>
        </div>

        <!-- User Controls & Action Bar -->
        <div class="flex items-center gap-2">
            <!-- Sync Status Indicator -->
            <div id="syncStatus" class="hidden flex items-center gap-1.5 bg-amber-100/60 border border-amber-900/15 px-2.5 py-1 rounded-lg text-xs font-medium text-amber-900">
                <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-500"></span>
                <span id="syncText" class="hidden sm:inline">เตรียมพร้อม</span>
            </div>

            <!-- Family Echo Quick Add Action Bar -->
            <button id="connectModeBtn" onclick="toggleConnectMode()" class="flex items-center gap-1.5 bg-amber-100/80 hover:bg-amber-200/80 text-amber-900 px-3 py-1.5 rounded-lg text-sm font-medium transition border border-amber-900/20 shadow-sm">
                <i class="fa-solid fa-diagram-project text-amber-800"></i>
                <span class="hidden md:inline">โยงความสัมพันธ์</span>
            </button>

            <!-- Add Root Member -->
            <button id="addRootBtn" onclick="openAddModal(null, 'root')" class="flex items-center gap-1.5 bg-amber-800 hover:bg-amber-900 text-amber-50 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-md shadow-amber-900/20">
                <i class="fa-solid fa-user-plus"></i>
                <span class="hidden md:inline">เพิ่มต้นตระกูล</span>
            </button>

            <div class="h-6 w-[1px] bg-amber-900/20 mx-1"></div>

            <!-- User Auth Profile Button -->
            <div id="userAuthSection" class="flex items-center gap-2">
                <button id="loginModalBtn" onclick="openAuthModal('login')" class="flex items-center gap-2 bg-stone-900 hover:bg-stone-800 text-amber-100 px-3.5 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-key"></i>
                    <span>เข้าสู่ระบบ</span>
                </button>
                
                <div id="userInfoDropdown" class="hidden flex items-center gap-2">
                    <div class="flex items-center gap-2 bg-amber-200/50 border border-amber-800/20 px-3 py-1 rounded-lg">
                        <i class="fa-solid fa-user-shield text-amber-800 text-xs"></i>
                        <span id="userDisplayName" class="text-xs font-semibold text-amber-950 max-w-[120px] truncate">ผู้ใช้งาน</span>
                    </div>
                    <button onclick="handleSignOut()" title="ออกจากระบบ" class="p-2 text-rose-700 hover:bg-rose-100/50 rounded-lg text-sm transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area: Canvas View -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Floating Zoom Controls -->
        <div class="absolute bottom-6 right-6 z-10 flex flex-col bg-[#fcf9f2] rounded-xl shadow-lg border border-amber-900/20 overflow-hidden">
            <button onclick="zoomIn()" title="ซูมเข้า" class="p-2.5 hover:bg-amber-100/60 text-amber-900 border-b border-amber-900/10 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="resetZoomPan()" title="จัดกึ่งกลาง" class="p-2.5 hover:bg-amber-100/60 text-amber-900 border-b border-amber-900/10 text-xs font-semibold transition">
                100%
            </button>
            <button onclick="zoomOut()" title="ซูมออก" class="p-2.5 hover:bg-amber-100/60 text-amber-900 transition">
                <i class="fa-solid fa-minus"></i>
            </button>
        </div>

        <!-- Family Echo Vintage Legend Box -->
        <div class="absolute top-4 left-4 z-10 bg-[#fbf7ee]/90 backdrop-blur border border-amber-900/20 p-3.5 rounded-xl shadow-md text-xs space-y-2 text-amber-950">
            <div class="font-bold text-amber-900 border-b border-amber-900/15 pb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-book-bookmark"></i> สัญลักษณ์เครือญาติ
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded-full bg-sky-700 inline-block border border-sky-800"></span>
                    <span class="text-stone-700">ชาย</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded-full bg-rose-700 inline-block border border-rose-800"></span>
                    <span class="text-stone-700">หญิง</span>
                </div>
            </div>
            <div class="flex items-center gap-2 pt-0.5">
                <span class="w-4 h-1 bg-rose-700 border-t border-dashed border-rose-700"></span>
                <span class="text-stone-700">คู่สมรส</span>
                <span class="w-4 h-0.5 bg-amber-800 ml-1"></span>
                <span class="text-stone-700">สายเลือด</span>
            </div>
        </div>

        <div id="connectNoticeBanner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-20 bg-amber-800 text-amber-50 px-4 py-2 rounded-full shadow-lg text-xs font-semibold flex items-center gap-2 animate-bounce border border-amber-700">
            <i class="fa-solid fa-hand-pointer"></i>
            <span id="connectNoticeText">คลิกเลือกสมาชิกคนที่ 1 เพื่อเริ่มเชื่อมความสัมพันธ์...</span>
            <button onclick="toggleConnectMode(false)" class="ml-2 hover:bg-amber-900 rounded-full w-4 h-4 flex items-center justify-center text-[10px]">✕</button>
        </div>

        <!-- Interactive Canvas Area -->
        <main id="canvasContainer" class="flex-1 h-full w-full bg-grid-pattern relative overflow-hidden cursor-grab active:cursor-grabbing select-none">
            <svg id="svgLines" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
            <div id="treeViewport" class="absolute top-0 left-0 origin-top-left transition-transform duration-75 ease-out z-1">
                <div id="treeNodesContainer" class="relative"></div>
            </div>
        </main>
    </div>

    <!-- MEMBER DETAILS & CONTROL PANEL (Drawer) -->
    <div id="detailDrawer" class="fixed inset-y-0 right-0 w-80 md:w-96 bg-[#fcf9f2] shadow-2xl border-l border-amber-900/20 z-40 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-amber-900/15 flex items-center justify-between bg-[#f4ece1]">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-address-card text-amber-800"></i>
                <h3 class="font-bold text-amber-950 text-base font-vintage">รายละเอียดข้อมูลญาติ</h3>
            </div>
            <button onclick="closeDetailDrawer()" class="text-amber-800/60 hover:text-amber-950 p-1 rounded-lg">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-5" id="drawerBody"></div>
        <div class="p-4 border-t border-amber-900/15 bg-[#f4ece1] flex gap-2">
            <button id="drawerEditBtn" class="flex-1 bg-amber-800 hover:bg-amber-900 text-amber-50 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i> แก้ไขข้อมูล
            </button>
            <button id="drawerDeleteBtn" class="bg-rose-100/80 hover:bg-rose-200 text-rose-800 border border-rose-300 py-2 px-3 rounded-lg text-sm font-medium transition">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    </div>

    <!-- FAMILY ECHO MEMBER FORM MODAL -->
    <div id="memberModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#fcf9f2] rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-fade-in border border-amber-900/30">
            <div class="px-6 py-4 border-b border-amber-900/15 flex items-center justify-between bg-[#f4ece1]">
                <h3 id="modalTitle" class="font-bold text-amber-950 text-lg font-vintage">เพิ่มสมาชิกในผังตระกูล</h3>
                <button onclick="closeModal()" class="text-amber-800/60 hover:text-amber-950 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="memberForm" class="flex-1 overflow-y-auto p-6 space-y-4 text-amber-950">
                <input type="hidden" id="memberId">
                <input type="hidden" id="relTargetId">
                <input type="hidden" id="relType">

                <div id="relInfoBanner" class="hidden p-3 bg-amber-100/70 border border-amber-800/20 rounded-xl text-xs text-amber-900 font-medium flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-amber-800"></i>
                    <span id="relInfoText">เพิ่มสมาชิกใหม่...</span>
                </div>

                <!-- Photo Upload -->
                <div class="flex flex-col items-center gap-2 pb-2">
                    <div class="relative group">
                        <img id="photoPreview" src="https://placehold.co/120x120/f3e8ff/78350f?text=รูปถ่าย" 
                            class="w-24 h-24 rounded-full object-cover border-4 border-amber-200 shadow-md">
                        <label for="photoInput" class="absolute bottom-0 right-0 bg-amber-800 text-amber-50 p-2 rounded-full shadow-lg cursor-pointer hover:bg-amber-900 transition">
                            <i class="fa-solid fa-camera text-xs"></i>
                        </label>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </div>

                <!-- Personal Name Information -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">ชื่อจริง <span class="text-rose-600">*</span></label>
                        <input type="text" id="firstName" required class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">นามสกุลปัจจุบัน</label>
                        <input type="text" id="lastName" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">นามสกุลเดิม (ก่อนแต่งงาน)</label>
                        <input type="text" id="maidenName" placeholder="เช่น นามสกุลก่อนแต่งงาน" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">ชื่อเล่น / ชื่อเรียกในตระกูล</label>
                        <input type="text" id="nickname" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                    </div>
                </div>

                <!-- Gender & Symbols -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">เพศกำเนิด <span class="text-rose-600">*</span></label>
                        <select id="gender" required class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                            <option value="male">ชาย</option>
                            <option value="female">หญิง</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">สัญลักษณ์ / เกียรติยศ</label>
                        <select id="badgeSymbol" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700 focus:outline-none">
                            <option value="">-- ไม่มี --</option>
                            <option value="👑">👑 ผู้นำตระกูล / ต้นตระกูล</option>
                            <option value="📜">📜 ผู้บันทึกประวัติศาสตร์ตระกูล</option>
                            <option value="🌟">🌟 บุคคลทรงเกียรติ</option>
                            <option value="🕊️">🕊️ ล่วงลับสู่วิมุตติ</option>
                            <option value="🎓">🎓 ปราชญ์ผู้ทรงคุณวุฒิ</option>
                            <option value="⚔️">⚔️ วีรบุรุษนักสู้</option>
                            <option value="🧬">🧬 สืบสายเลือดหลัก</option>
                            <option value="💍">💍 สมรสสัมพันธ์</option>
                        </select>
                    </div>
                </div>

                <!-- Birth & Death Details -->
                <div class="p-3.5 bg-[#f4ece1] rounded-xl space-y-3 border border-amber-900/15">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-amber-950">สถานะชีวิต</label>
                        <div class="flex items-center gap-4 text-xs">
                            <label class="inline-flex items-center gap-1 cursor-pointer">
                                <input type="radio" name="isAlive" value="true" checked onchange="toggleDeathDateInput()">
                                <span class="text-emerald-900 font-medium">ยังมีชีวิตอยู่</span>
                            </label>
                            <label class="inline-flex items-center gap-1 cursor-pointer">
                                <input type="radio" name="isAlive" value="false" onchange="toggleDeathDateInput()">
                                <span class="text-amber-900/80">ถึงแก่กรรม / เสียชีวิต</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <div>
                            <label class="block text-[11px] font-medium text-amber-900 mb-1">วัน/เดือน/ปีเกิด</label>
                            <input type="date" id="birthDate" class="w-full px-2.5 py-1.5 text-xs bg-white border border-amber-900/20 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-amber-900 mb-1">สถานที่เกิด</label>
                            <input type="text" id="birthPlace" placeholder="จังหวัด / เมือง" class="w-full px-2.5 py-1.5 text-xs bg-white border border-amber-900/20 rounded-lg">
                        </div>
                    </div>

                    <div id="deathDateContainer" class="grid grid-cols-2 gap-3 pt-1 opacity-50 pointer-events-none">
                        <div>
                            <label class="block text-[11px] font-medium text-amber-900 mb-1">วันที่เสียชีวิต</label>
                            <input type="date" id="deathDate" class="w-full px-2.5 py-1.5 text-xs bg-white border border-amber-900/20 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-amber-900 mb-1">สถานที่เสียชีวิต / สุสาน</label>
                            <input type="text" id="deathPlace" placeholder="ฌาปนสถาน / สุสาน" class="w-full px-2.5 py-1.5 text-xs bg-white border border-amber-900/20 rounded-lg">
                        </div>
                    </div>
                </div>

                <!-- Contact & Profession -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">อาชีพ / ตำแหน่งงาน</label>
                        <input type="text" id="profession" placeholder="เช่น ข้าราชการ, ค้าขาย" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1">เบอร์โทรศัพท์</label>
                        <input type="tel" id="phone" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-amber-900 mb-1">ที่อยู่ปัจจุบัน / ภูมิลำเนาเดิม</label>
                    <input type="text" id="address" class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-amber-900 mb-1">ประวัติสังเขป / เรื่องราวประจำตัว (Family Biography)</label>
                    <textarea id="bio" rows="3" placeholder="บันทึกเรื่องราว ความทรงจำ หรือเกียรติประวัติของญาติท่านนี้..." class="w-full px-3 py-2 text-sm bg-white border border-amber-900/20 rounded-lg"></textarea>
                </div>
            </form>

            <div class="px-6 py-3.5 border-t border-amber-900/15 bg-[#f4ece1] flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-amber-900 hover:bg-amber-200/60 rounded-lg">ยกเลิก</button>
                <button type="button" onclick="saveMemberForm()" class="px-5 py-2 text-sm font-medium bg-amber-800 hover:bg-amber-900 text-amber-50 rounded-lg shadow-md">บันทึกข้อมูลสมาชิก</button>
            </div>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div id="authModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#fcf9f2] rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-fade-in border border-amber-900/30">
            <div class="flex border-b border-amber-900/15 bg-[#f4ece1]">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-3 text-sm font-semibold text-amber-900 border-b-2 border-amber-800 bg-[#fcf9f2]">เข้าสู่ระบบ</button>
                <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-3 text-sm font-semibold text-amber-800/60 hover:text-amber-950">ลงทะเบียน</button>
            </div>

            <!-- Login Form -->

        /* ==========================================================================
           PAN & ZOOM CANVAS SYSTEM
           ========================================================================== */
        function setupPanAndZoom() {
            const container = document.getElementById("canvasContainer");
            const viewport = document.getElementById("treeViewport");

            container.addEventListener("mousedown", (e) => {
                if (e.target.closest(".member-card") || e.target.closest("button")) return;
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            window.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform();
            });

            window.addEventListener("mouseup", () => isDragging = false);

            container.addEventListener("wheel", (e) => {
                e.preventDefault();
                const zoomFactor = 0.08;
                if (e.deltaY < 0) scale = Math.min(scale + zoomFactor, 2.5);
                else scale = Math.max(scale - zoomFactor, 0.3);
                applyTransform();
            }, { passive: false });
        }

        function applyTransform() {
            const viewport = document.getElementById("treeViewport");
            if (viewport) {
                viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            }
        }

        window.zoomIn = () => { scale = Math.min(scale + 0.15, 2.5); applyTransform(); };
        window.zoomOut = () => { scale = Math.max(scale - 0.15, 0.3); applyTransform(); };
        window.resetZoomPan = () => { scale = 1; panX = 0; panY = 0; applyTransform(); };

        /* ==========================================================================

           ========================================================================== */
        function renderTree() {
            const container = document.getElementById("treeNodesContainer");
            const svg = document.getElementById("svgLines");
            if (!container || !svg) return;

            container.innerHTML = "";
            svg.innerHTML = "";

            if (familyData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-amber-800/60 bg-[#fcf9f2]/90 rounded-2xl border border-dashed border-amber-900/20 shadow-sm max-w-sm mx-auto my-20">
                        <i class="fa-solid fa-users-viewfinder text-5xl mb-3 text-amber-800/40"></i>
                        <p class="font-bold text-amber-950 font-vintage text-lg">ยังไม่มีข้อมูลในผังตระกูล</p>
                        <p class="text-xs mt-1 text-amber-800">คลิกปุ่ม "เพิ่มต้นตระกูล" เพื่อเริ่มสร้างสายเลือดแห่งตระกูล</p>
                    </div>
                `;
                return;
            }

            const positions = calculateLayoutPositions();

            familyData.forEach(member => {
                const pos = positions[member.id] || { x: 0, y: 0 };
                const card = createMemberCardElement(member, pos);
                container.appendChild(card);
            });

            drawConnections(positions);
        }

        function calculateLayoutPositions() {
            const positions = {};
            const CARD_WIDTH = 210, CARD_HEIGHT = 130;
            const GAP_X = 50, GAP_Y = 110;

            const roots = familyData.filter(m => (!m.parentIds || m.parentIds.length === 0));
            const levels = {};

            function assignLevel(memberId, currentLevel) {
                if (levels[memberId] !== undefined && levels[memberId] >= currentLevel) return;
                levels[memberId] = currentLevel;
                const member = familyData.find(m => m.id === memberId);
                if (!member) return;

                (member.spouseIds || []).forEach(sId => levels[sId] = currentLevel);
                (member.childrenIds || []).forEach(cId => assignLevel(cId, currentLevel + 1));
            }

            roots.forEach(r => assignLevel(r.id, 0));
            familyData.forEach(m => { if (levels[m.id] === undefined) levels[m.id] = 0; });

            const levelGroups = {};
            Object.keys(levels).forEach(mId => {
                const lvl = levels[mId];
                if (!levelGroups[lvl]) levelGroups[lvl] = [];
                if (!levelGroups[lvl].includes(mId)) levelGroups[lvl].push(mId);
            });

            Object.keys(levelGroups).forEach(lvlStr => {
                const list = levelGroups[lvlStr];
                const totalWidth = list.length * CARD_WIDTH + (list.length - 1) * GAP_X;
                const startX = -totalWidth / 2;

                list.forEach((mId, index) => {
                    positions[mId] = {
                        x: startX + index * (CARD_WIDTH + GAP_X),
                        y: parseInt(lvlStr) * (CARD_HEIGHT + GAP_Y)
                    };
                });
            });

            return positions;
        }

        function drawConnections(positions) {
            const svg = document.getElementById("svgLines");
            const CARD_WIDTH = 210, CARD_HEIGHT = 130;

            familyData.forEach(member => {
                const parentPos = positions[member.id];
                if (!parentPos) return;

                // Draw Spouse Lines
                (member.spouseIds || []).forEach(spouseId => {
                    if (member.id < spouseId && positions[spouseId]) {
                        const spousePos = positions[spouseId];
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", parentPos.x + CARD_WIDTH);
                        line.setAttribute("y1", parentPos.y + CARD_HEIGHT / 2);
                        line.setAttribute("x2", spousePos.x);
                        line.setAttribute("y2", spousePos.y + CARD_HEIGHT / 2);
                        line.setAttribute("class", "spouse-line");
                        line.onclick = (e) => { e.stopPropagation(); promptRemoveRelation(member.id, spouseId, 'spouse'); };
                        svg.appendChild(line);
                    }
                });

                // Draw Children Lines
                (member.childrenIds || []).forEach(childId => {
                    const childPos = positions[childId];
                    if (childPos) {
                        const startX = parentPos.x + (CARD_WIDTH / 2);
                        const startY = parentPos.y + CARD_HEIGHT;
                        const endX = childPos.x + (CARD_WIDTH / 2);
                        const endY = childPos.y;
                        const midY = startY + (endY - startY) / 2;

                        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path.setAttribute("d", `M ${startX} ${startY} V ${midY} H ${endX} V ${endY}`);
                        path.setAttribute("class", "tree-line");
                        path.onclick = (e) => { e.stopPropagation(); promptRemoveRelation(member.id, childId, 'child'); };
                        svg.appendChild(path);
                    }
                });
            });
        }

        function promptCreateRelation(m1, m2) {
            const relType = prompt(`เลือกประเภทสายสัมพันธ์ระหว่าง:\n[1] ${m1.firstName} เป็น พ่อ/แม่ ของ ${m2.firstName}\n[2] ${m1.firstName} เป็น คู่สมรส ของ ${m2.firstName}\n[3] ${m1.firstName} เป็น ลูก ของ ${m2.firstName}\n\nพิมพ์ตัวเลข 1, 2 หรือ 3:`);
            
            if (relType === "1") {
                addRelationLink(m1.id, m2.id, 'child');
            } else if (relType === "2") {
                addRelationLink(m1.id, m2.id, 'spouse');
            } else if (relType === "3") {
                addRelationLink(m2.id, m1.id, 'child');
            }

            toggleConnectMode(false);
        }

        async function addRelationLink(parentId, childOrSpouseId, type) {
            const source = familyData.find(m => m.id === parentId);
            const target = familyData.find(m => m.id === childOrSpouseId);
            if (!source || !target) return;

            if (type === 'child') {
                source.childrenIds = source.childrenIds || [];
                target.parentIds = target.parentIds || [];
                if (!source.childrenIds.includes(target.id)) source.childrenIds.push(target.id);
                if (!target.parentIds.includes(source.id)) target.parentIds.push(source.id);
            } else if (type === 'spouse') {
                source.spouseIds = source.spouseIds || [];
                target.spouseIds = target.spouseIds || [];
                if (!source.spouseIds.includes(target.id)) source.spouseIds.push(target.id);
                if (!target.spouseIds.includes(source.id)) target.spouseIds.push(source.id);
            }

            renderTree();
            await saveFamilyDataToCloud();
            showToast("เพิ่มสายสัมพันธ์เรียบร้อยแล้ว", "success");
        }

        async function promptRemoveRelation(m1Id, m2Id, type) {
            const m1 = familyData.find(m => m.id === m1Id);
            const m2 = familyData.find(m => m.id === m2Id);
            if (!m1 || !m2) return;

            if (confirm(`ต้องการลบเส้นสายสัมพันธ์ระหว่าง ${m1.firstName} และ ${m2.firstName} ใช่หรือไม่?`)) {
                if (type === 'child') {
                    m1.childrenIds = (m1.childrenIds || []).filter(id => id !== m2Id);
                    m2.parentIds = (m2.parentIds || []).filter(id => id !== m1Id);
                } else if (type === 'spouse') {
                    m1.spouseIds = (m1.spouseIds || []).filter(id => id !== m2Id);
                    m2.spouseIds = (m2.spouseIds || []).filter(id => id !== m1Id);
                }
                renderTree();
                await saveFamilyDataToCloud();
                showToast("ลบสายสัมพันธ์เรียบร้อยแล้ว", "info");
            }
        }

        function subscribeToFamilyTreeData(userId) {
            updateSyncStatus('syncing', 'กำลังโหลดข้อมูล...');
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'family_tree', 'main_tree');

            if (unsubscribeFirestore) unsubscribeFirestore();

            unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().members && docSnap.data().members.length > 0) {
                    familyData = docSnap.data().members;
                } else {
                    // Initialize with Default Xeem Lis Tree if cloud database is empty
                    familyData = defaultXeemLisTree;
                    saveFamilyDataToCloud();
                }
                renderTree();
                updateSyncStatus('online', 'ซิงค์ข้อมูล Cloud แล้ว');
            }, (error) => {
                console.error("Firestore Error:", error);
                updateSyncStatus('error', 'ข้อผิดพลาดการเชื่อมต่อ');
            });
        }

        async function saveFamilyDataToCloud() {
            if (!currentUser) {
                localStorage.setItem("family_tree_local_data", JSON.stringify(familyData));
                updateSyncStatus('offline', 'บันทึกลงในเครื่อง');
                return;
            }

            updateSyncStatus('syncing', 'กำลังบันทึก...');
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'family_tree', 'main_tree');
                await setDoc(docRef, {
                    members: familyData,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                updateSyncStatus('online', 'บันทึกสำเร็จ');
            } catch (err) {
                console.error("Cloud Save Error:", err);
                updateSyncStatus('error', 'บันทึกไม่สำเร็จ');
            }
        }

        /* ==========================================================================
           AUTH HANDLERS & HELPERS
           ========================================================================== */
        window.handleEmailLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                closeAuthModal();
                showToast("เข้าสู่ระบบเรียบร้อยแล้ว", "success");
            } catch (err) {
                showToast("เข้าสู่ระบบไม่สำเร็จ: " + err.message, "error");
            }
        };

        window.handleEmailRegister = async (e) => {
            e.preventDefault();
            const name = document.getElementById("regDisplayName").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(res.user, { displayName: name });
                closeAuthModal();
                showToast("สมัครสมาชิกสำเร็จ!", "success");
            } catch (err) {
                showToast("ลงทะเบียนไม่สำเร็จ: " + err.message, "error");
            }
        };

        window.handleGoogleSignIn = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                closeAuthModal();
                showToast("เข้าสู่ระบบด้วย Google เรียบร้อยแล้ว", "success");
            } catch (err) {
                showToast("การเข้าสู่ระบบผ่าน Google ขัดข้อง", "error");
            }
        };

        window.handleAnonymousSignIn = async () => {
            try {
                await signInAnonymously(auth);
                closeAuthModal();
                showToast("เข้าสู่ระบบชั่วคราวในฐานะ Guest", "info");
            } catch (err) {
                showToast("เข้าใช้งานแบบ Guest ไม่สำเร็จ", "error");
            }
        };

        window.handleSignOut = async () => {
            await signOut(auth);
            showToast("ออกจากระบบแล้ว", "info");
        };

        function updateAuthUI(user) {
            const loginBtn = document.getElementById("loginModalBtn");
            const userInfo = document.getElementById("userInfoDropdown");
            const userName = document.getElementById("userDisplayName");

            if (user && !user.isAnonymous) {
                loginBtn?.classList.add("hidden");
                userInfo?.classList.remove("hidden");
                if (userName) userName.textContent = user.displayName || user.email || "สมาชิก";
            } else {
                loginBtn?.classList.remove("hidden");
                userInfo?.classList.add("hidden");
            }
        }

        function updateSyncStatus(status, text) {
            const syncStatus = document.getElementById("syncStatus");
            const syncDot = document.getElementById("syncDot");
            const syncText = document.getElementById("syncText");

            if (!syncStatus || !syncDot || !syncText) return;

            syncStatus.classList.remove("hidden");
            syncText.textContent = text;

            if (status === 'online') {
                syncDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            } else if (status === 'syncing') {
                syncDot.className = "w-2 h-2 rounded-full bg-amber-500 animate-spin";
            } else {
                syncDot.className = "w-2 h-2 rounded-full bg-rose-500";
            }
        }

        function setupSearch() {
            const input = document.getElementById("searchInput");
            if (!input) return;
            input.addEventListener("input", (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) return;
                const match = familyData.find(m => m.firstName.toLowerCase().includes(query) || (m.nickname && m.nickname.toLowerCase().includes(query)));
                if (match) {
                    const card = document.querySelector(`[data-id="${match.id}"]`);
                    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function showToast(message, type = "info") {
            const toast = document.createElement("div");
            toast.className = "bg-amber-950 text-amber-50 px-4 py-2.5 rounded-xl text-xs shadow-xl animate-fade-in border border-amber-800/40";
            toast.textContent = message;
            document.getElementById("toastContainer").appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }
    </script>
</body>
</html>
